<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>セキュリティニュース</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1d2228; --muted: #5d6773; --line: #e2e6eb;
    --crit: #c62828; --crit-bg: #fdecec; --note: #a86800; --note-bg: #fff6e0; --other: #8a939e;
    --chip: #eef1f4; --link: #0b5cad; --hover: #f0f3f6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121417; --card: #1b1f24; --text: #e6e9ed; --muted: #9aa4af; --line: #2c3239;
      --crit: #ff6b6b; --crit-bg: #3a1d1f; --note: #f2b84b; --note-bg: #3a2f17; --other: #6f7983;
      --chip: #262c33; --link: #6db3ff; --hover: #232930;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 16px 16px 48px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 18px; margin: 0; }
  h2 { font-size: 13px; color: var(--muted); font-weight: 600; margin: 20px 0 8px; }
  select { font: inherit; padding: 4px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
  .headline { font-size: 14px; color: var(--muted); margin: 12px 0 0; }
  .counts { font-size: 13px; color: var(--muted); margin-top: 4px; }

  /* ---- 今日の話題（キーワード一覧） ---- */
  .board { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; }
  .tile {
    display: flex; gap: 8px; align-items: flex-start; width: 100%;
    background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--other);
    border-radius: 0 10px 10px 0; padding: 9px 10px; min-height: 58px;
  }
  .tile:hover { background: var(--hover); }
  .tile.critical { border-left-color: var(--crit); }
  .tile.notable { border-left-color: var(--note); }
  .tile .icon { font-size: 18px; line-height: 1.2; }
  .tile .kw { font-weight: 700; font-size: 15px; line-height: 1.3; word-break: break-word; }
  .tile .sub { font-size: 12px; color: var(--muted); line-height: 1.4; margin-top: 2px; }
  .tile.critical .hot { color: var(--crit); }
  .others { font-size: 13px; color: var(--muted); margin-top: 10px; line-height: 1.9; }
  .others button { color: var(--text); border-bottom: 1px dotted var(--muted); }

  /* ---- 詳細（1行に折りたたみ） ---- */
  .list { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  details { border-top: 1px solid var(--line); }
  details:first-child { border-top: 0; }
  summary {
    list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px;
    padding: 10px 12px; min-height: 44px;
  }
  summary::-webkit-details-marker { display: none; }
  summary:hover { background: var(--hover); }
  summary::after { content: "▾"; color: var(--muted); margin-left: auto; padding-left: 6px; transition: transform .15s; }
  details[open] summary::after { transform: rotate(180deg); }
  .pill { font-size: 11px; padding: 1px 7px; border-radius: 6px; white-space: nowrap; background: var(--chip); color: var(--muted); }
  .pill.critical { background: var(--crit-bg); color: var(--crit); }
  .pill.notable { background: var(--note-bg); color: var(--note); }
  .pill.update { background: var(--note-bg); color: var(--note); }
  .s-kw { font-weight: 700; white-space: nowrap; }
  .s-title { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
  .body { padding: 2px 14px 14px; }
  .body .title { font-weight: 600; margin: 0 0 6px; }
  dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 14px; }
  dt { color: var(--muted); font-size: 13px; white-space: nowrap; }
  dd { margin: 0; }
  .meta { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; }
  .chip { background: var(--chip); border-radius: 6px; padding: 1px 7px; }
  .chip.hot { background: var(--crit-bg); color: var(--crit); }
  .cve { font-family: ui-monospace, Consolas, monospace; }
  .links { margin-top: 8px; font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 14px; }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .empty { color: var(--muted); font-size: 14px; padding: 4px 2px; }
  footer { margin-top: 28px; color: var(--muted); font-size: 12px; }
  .ng { color: var(--crit); }
  @keyframes flash { from { background: var(--note-bg); } to { background: transparent; } }
  details.flash { animation: flash 1.2s ease-out; }
</style>
</head>
<body>
<main>
  <header>
    <h1>🛡 セキュリティニュース</h1>
    <select id="date" aria-label="日付を選択"></select>
  </header>
  <div id="report"><p class="empty">読み込み中…</p></div>
  <footer id="footer"></footer>
</main>
<script>
// 表示はすべて textContent で行い、レポート内の文字列をHTMLとして解釈しない
const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
};
const safeUrl = u => /^https?:\/\//.test(u || "") ? u : null;
const HOT_TAGS = new Set(["KEV", "悪用確認済み", "PoC公開", "ランサムウェア"]);
// 一覧で短く見せるためのタグの言い換え（優先順）
const HOT_SHORT = [["悪用確認済み", "悪用中"], ["KEV", "KEV"], ["PoC公開", "PoC公開"], ["ランサムウェア", "ランサム"],
                   ["サプライチェーン", "供給網"], ["情報漏洩", "漏洩"], ["サービス停止", "停止"]];
const KIND_ICON = { vulnerability: "🐞", incident: "🔓", outage: "⛔", other: "📰" };
const LEVEL_LABEL = { critical: "緊急", notable: "注目", other: "参考" };

// keyword/target がない古いレポート向けに見出しで代用する
const keywordOf = it => it.keyword || (it.title.length > 16 ? it.title.slice(0, 15) + "…" : it.title);
const hotOf = it => { const h = HOT_SHORT.find(([t]) => (it.tags || []).includes(t)); return h ? h[1] : null; };

async function getJson(path) {
  const r = await fetch(path, { cache: "no-cache" });
  if (!r.ok) throw new Error(`${path}: ${r.status}`);
  return r.json();
}

function renderLinks(item) {
  const box = el("div", "links");
  (item.sources || []).forEach(s => {
    const url = safeUrl(s.url);
    if (!url) return;
    const a = el("a", null, s.name + " ↗");
    a.href = url; a.target = "_blank"; a.rel = "noopener noreferrer";
    box.append(a);
  });
  return box;
}

// 一覧のタイルや「ほか」をタップしたら、その項目を開いてスクロールする
function jumpTo(id) {
  const d = document.getElementById(id);
  if (!d) return;
  d.open = true;
  d.scrollIntoView({ behavior: "smooth", block: "start" });
  d.classList.remove("flash"); void d.offsetWidth; d.classList.add("flash");
}

function renderTile(item, id) {
  const b = el("button", "tile " + item.level);
  b.addEventListener("click", () => jumpTo(id));
  b.append(el("span", "icon", KIND_ICON[item.kind] || KIND_ICON.other));
  const box = el("div");
  box.append(el("div", "kw", keywordOf(item)));
  const sub = el("div", "sub");
  const parts = [];
  if (item.is_update) parts.push(["続報", "hot"]);
  if (item.target) parts.push([item.target, ""]);
  const hot = hotOf(item);
  if (hot) parts.push([hot, HOT_TAGS.has((HOT_SHORT.find(h => h[1] === hot) || [])[0]) ? "hot" : ""]);
  parts.forEach(([t, cls], i) => {
    if (i) sub.append(document.createTextNode("・"));
    sub.append(el("span", cls, t));
  });
  if (parts.length) box.append(sub);
  b.append(box);
  return b;
}

function renderDetail(item, id) {
  const d = el("details");
  d.id = id;
  const s = el("summary");
  s.append(el("span", "pill " + item.level, LEVEL_LABEL[item.level] || ""));
  if (item.is_update) s.append(el("span", "pill update", "続報"));
  s.append(el("span", null, KIND_ICON[item.kind] || KIND_ICON.other));
  s.append(el("span", "s-kw", keywordOf(item)));
  s.append(el("span", "s-title", item.title));
  d.append(s);

  const body = el("div", "body");
  body.append(el("p", "title", item.title));
  const dl = el("dl");
  [["何が", item.what], ["影響", item.who], ["対応", item.action]].forEach(([k, v]) => {
    if (v) dl.append(el("dt", null, k), el("dd", null, v));
  });
  body.append(dl);
  const meta = el("div", "meta");
  (item.tags || []).forEach(t => meta.append(el("span", "chip" + (HOT_TAGS.has(t) ? " hot" : ""), t)));
  (item.cves || []).forEach(c => {
    const a = el("a", "chip cve", c);
    a.href = "https://nvd.nist.gov/vuln/detail/" + encodeURIComponent(c);
    a.target = "_blank"; a.rel = "noopener noreferrer";
    meta.append(a);
  });
  if (meta.childNodes.length) body.append(meta);
  body.append(renderLinks(item));
  d.append(body);
  return d;
}

function renderReport(rep) {
  const root = document.getElementById("report");
  root.replaceChildren();
  const items = (rep.items || []).map((it, i) => ({ it, id: "item-" + i }));
  const by = lv => items.filter(x => x.it.level === lv);
  const crit = by("critical"), note = by("notable"), other = by("other");

  root.append(el("p", "headline", rep.headline));
  root.append(el("div", "counts",
    `🔴 緊急 ${crit.length}　🟡 注目 ${note.length}　⚪ 参考 ${other.length}` +
    (rep.stats ? `（${rep.stats.items}件の記事から選別）` : "")));

  // 今日の話題：緊急と注目をキーワードで一覧
  root.append(el("h2", null, "今日の話題（タップで詳細）"));
  const top = crit.concat(note);
  if (top.length) {
    const board = el("div", "board");
    top.forEach(x => board.append(renderTile(x.it, x.id)));
    root.append(board);
  } else {
    root.append(el("p", "empty", "緊急・注目の話題はありません"));
  }
  if (other.length) {
    const o = el("div", "others");
    o.append(document.createTextNode("ほか："));
    other.forEach((x, i) => {
      if (i) o.append(document.createTextNode(" ／ "));
      const b = el("button", null, keywordOf(x.it));
      b.addEventListener("click", () => jumpTo(x.id));
      o.append(b);
    });
    root.append(o);
  }

  // 詳細：区分ごとに1行で並べ、タップで開く
  [["🔴 緊急", crit], ["🟡 注目", note], ["⚪ 参考", other]].forEach(([label, list]) => {
    if (!list.length) return;
    root.append(el("h2", null, label));
    const box = el("div", "list");
    list.forEach(x => box.append(renderDetail(x.it, x.id)));
    root.append(box);
  });

  const f = document.getElementById("footer");
  f.replaceChildren();
  if (rep.generated_at) f.append(el("div", null, "生成: " + new Date(rep.generated_at).toLocaleString("ja-JP")));
  const ng = (rep.source_status || []).filter(s => !s.ok);
  if (ng.length) f.append(el("div", "ng", "取得失敗: " + ng.map(s => s.name).join("、")));
  f.append(el("div", null, "要約はAIによる自動生成です。対応判断の前に必ず元記事を確認してください。"));
}

async function load(date) {
  try {
    renderReport(await getJson(`data/${date}.json`));
  } catch (e) {
    document.getElementById("report").replaceChildren(el("p", "empty", "レポートを読み込めませんでした（" + e.message + "）"));
  }
}

(async () => {
  const sel = document.getElementById("date");
  let index = [];
  try { index = await getJson("data/index.json"); } catch (e) { /* 目次がない場合は下で表示 */ }
  if (!index.length) {
    document.getElementById("report").replaceChildren(el("p", "empty", "まだレポートがありません。"));
    return;
  }
  index.forEach(d => {
    const o = el("option", null, `${d.date}　🔴${d.critical} 🟡${d.notable}`);
    o.value = d.date;
    sel.append(o);
  });
  // URLの #YYYY-MM-DD で日付を指定できる（共有用）
  const want = location.hash.slice(1);
  sel.value = index.some(d => d.date === want) ? want : index[0].date;
  sel.addEventListener("change", () => { location.hash = sel.value; load(sel.value); });
  load(sel.value);
})();
</script>
</body>
</html>
